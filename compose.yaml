services:
  postgres:
    image: postgres:18
    container_name: bs-aesthetics-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - bs_aesthetics_api_pgdata:/var/lib/postgresql

volumes:
  bs_aesthetics_api_pgdata:
    name: bs_aesthetics_api_pgdata
