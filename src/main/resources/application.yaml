spring:
  application:
    name: bs-aesthetics-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bs_aesthetics_api}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
